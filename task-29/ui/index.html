<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        
        <div class="left">
            <div class="left-content">
                <img src="./loginImage.png" alt="">
            </div>
        </div>

        <div class="right-side">
            <div class="form-box">
                <h2 data-key="loginTitle">Welcome Back!</h2>
                <p class="sub" data-key="loginSub">Login to your account</p>
                <form>
                    <div class="input-group">
                        <label data-key="email">Email</label>
                        <input data-key="password" type="email" placeholder="example@gmail.com" id="input">
                    </div>

                    <div class="input-group">
                        <label data-key="password"> Password</label>
                        <input  type="password" placeholder="*********" id="input">
                    </div>

                    <div class="options">
                        <label>
                            <input type="checkbox"> Remember Me
                        </label>
                    </div>

                    <button class="btn" data-key="loginBtn">Login</button>
                </form>

                <div class="divider">Or continue with</div>
                <div class="socials">
                    <button class="google"><i class="fa-brands fa-google"></i></button>
                    <button class="facebook"><i class="fa-brands fa-facebook"></i></button>
                </div>

                <p class="register">Not Registered Yet? <a href="./register.html">Create an account</a></p>
            </div>
        </div>
    </div>


    <div class="language-dropdown">
            <select id="languageSelect">
                <option value="az">AZ</option>
                <option value="en">ENG</option>
                <option value="ru">RU</option>
            </select>
    </div>


    <script src="./app.js"></script>
</body>
</html>
