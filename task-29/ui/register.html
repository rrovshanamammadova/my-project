<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
     <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
     <div class="register-cont">
        <form id="registerForm" class="form">
            <h2>Create Account</h2>
            <p class="sub">Register your new account</p>

        <div class="input-group">
            <label>Full Name</label>
            <input type="text" required id="input">
        </div>

        <div class="input-group">
            <label>Email</label>
            <input type="email" required id="input">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" required id="input">
        </div>

        <div class="input-group">
            <label>Confirm Password</label>
            <input type="password" required id="input">
        </div>

        <button class="btn">Register</button>

        <p class="switch">Already have an account? <a href="./index.html" class="login">Login</a></p>
        </form>
     </div>

     <script src="./app.js"></script>
</body>
</html>
